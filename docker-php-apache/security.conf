ServerName localhost
ServerTokens Prod
ServerSignature Off

# Private files must never be downloadable over HTTP.
<FilesMatch "(?i)(^\.|\.(secret|dist|env|bak|backup|old|orig|save|swp|sql|log|pem|key|p12|pfx|crt)$|^composer\.(json|lock|phar)$|^cryptoKey\.json$|^settings.*\.php\.[a-z0-9_-]+$|^php-apache\.env$|^ejemplo\.env)">
    Require all denied
</FilesMatch>

# Composer dependencies are only loaded server-side.
<DirectoryMatch "^/var/www/html/vendor(/|$)">
    Require all denied
</DirectoryMatch>
